[package]
name = "postflop-solver"
version = "0.1.0"
authors = ["Wataru Inariba"]
edition = "2024"
rust-version = "1.96"
description = "An open-source postflop solver for Texas hold'em poker"
documentation = "https://b-inary.github.io/postflop_solver/postflop_solver/"
repository = "https://github.com/b-inary/postflop-solver"
license = "AGPL-3.0-or-later"

[dependencies]
# Pinned exactly: bincode 2.0.0 stable changed the `Decode` trait (added a `Context` generic), and
# this crate's codec has not been migrated to that API yet. bincode_derive is pinned to the same
# exact version for the same reason: bincode rc.3's own dependency on bincode_derive is loose
# enough to resolve to the incompatible 2.0.1 stable release, which carries the same breaking
# trait change.
bincode = { version = "=2.0.0-rc.3", optional = true }
bincode_derive = { version = "=2.0.0-rc.3", optional = true }
rayon = { version = "1.12", optional = true }
regex = "1.13"
zstd = { version = "0.14", optional = true, default-features = false }

[dev-dependencies]
# `cargo_bench_support` lets the benches run under `cargo bench`. The rest of the default features
# only drive criterion's own plotting and report generation, which this crate does not use.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[features]
default = ["bincode", "rayon"]
bincode = ["dep:bincode", "dep:bincode_derive"]
custom-alloc = []
rayon = ["dep:rayon", "zstd?/zstdmt"]

[[bench]]
name = "solve"
harness = false
